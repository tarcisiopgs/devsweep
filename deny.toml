# cargo-deny: what a dependency may be. Run `cargo deny check`.

[graph]
# The six targets a release is built for.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]

[licenses]
# devsweep is MIT: only licenses that ask for no more than attribution.
# Anything copyleft fails the check.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Two versions of a crate come from dependencies (hashbrown, syn): worth
# seeing, not worth failing for.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
