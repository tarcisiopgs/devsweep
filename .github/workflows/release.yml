name: Release

# Publishing a GitHub Release (e.g. `gh release create v0.2.0 --generate-notes`)
# builds the macOS, Linux and Windows binaries, attaches them to the release and publishes the npm
# packages through trusted publishing (OIDC). npm trusts this file by name.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # Static binaries: one file per architecture runs on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
    # The steps are written for bash, which the Windows runner also has.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo build --release --locked --target "$TARGET"
      - name: Attach the archive to the release
        run: |
          name="devsweep-$TARGET"
          # Windows gets devsweep.exe in a zip; the others a tar.xz.
          case "$TARGET" in
            *windows*) bin=devsweep.exe; archive="$name.zip" ;;
            *) bin=devsweep; archive="$name.tar.xz" ;;
          esac
          mkdir "$name"
          cp "target/$TARGET/release/$bin" README.md LICENSE "$name/"
          mkdir "$name/assets"
          cp assets/devsweep-banner.webp "$name/assets/"
          case "$archive" in
            *.zip) 7z a "$archive" "$name" >/dev/null ;;
            *) tar -cJf "$archive" "$name" ;;
          esac
          shasum -a 256 "$archive" > "$archive.sha256"
          gh release upload "$TAG" "$archive" "$archive.sha256" --clobber

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or newer; no token is stored anywhere.
      - run: npm install -g npm@latest
      - name: Publish packages
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Re-running a release must not fail on versions already on npm.
          publish() {
            local name version
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
            else
              npm publish --provenance --access public
            fi
          }
          mkdir dl
          gh release download "$TAG" --pattern 'devsweep-*.tar.xz' --pattern 'devsweep-*.zip' --dir dl
          for entry in \
            "darwin:arm64:aarch64-apple-darwin" \
            "darwin:x64:x86_64-apple-darwin" \
            "linux:arm64:aarch64-unknown-linux-musl" \
            "linux:x64:x86_64-unknown-linux-musl" \
            "win32:arm64:aarch64-pc-windows-msvc" \
            "win32:x64:x86_64-pc-windows-msvc"; do
            IFS=: read -r OS ARCH TARGET <<< "$entry"
            PKG="pkg-$OS-$ARCH"
            NAME="devsweep-$OS-$ARCH"
            if [ "$OS" = win32 ]; then
              # npm refuses the unscoped names (its spam detection rejects
              # `devsweep-win32-*`), so the Windows packages are scoped.
              NAME="@tarcisiopgs/$NAME"
              BIN=devsweep.exe
              unzip -q "dl/devsweep-$TARGET.zip" -d dl
            else
              BIN=devsweep
              tar -xJf "dl/devsweep-$TARGET.tar.xz" -C dl
            fi
            mkdir -p "$PKG/bin"
            cp "dl/devsweep-$TARGET/$BIN" "$PKG/bin/$BIN"
            chmod +x "$PKG/bin/$BIN"
            NAME="$NAME" OS="$OS" ARCH="$ARCH" VERSION="$VERSION" envsubst < npm/platform/package.json.tmpl > "$PKG/package.json"
            cp LICENSE "$PKG/"
            (cd "$PKG" && publish)
          done
          cd npm/devsweep
          cp ../../LICENSE ../../README.md .
          # npm renders the README outside the repository; resolve local links
          # against this release so its banner and reference links still work.
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.TAG;
          const repo = 'https://github.com/tarcisiopgs/devsweep';
          const readme = fs.readFileSync('README.md', 'utf8')
            .replace('(assets/devsweep-banner.webp)', `(https://raw.githubusercontent.com/tarcisiopgs/devsweep/${tag}/assets/devsweep-banner.webp)`)
            .replaceAll('(CONTRIBUTING.md)', `(${repo}/blob/${tag}/CONTRIBUTING.md)`)
            .replaceAll('(LICENSE)', `(${repo}/blob/${tag}/LICENSE)`);
          fs.writeFileSync('README.md', readme);
          NODE
          npm pkg set version="$VERSION" \
            "optionalDependencies.devsweep-darwin-arm64=$VERSION" \
            "optionalDependencies.devsweep-darwin-x64=$VERSION" \
            "optionalDependencies.devsweep-linux-arm64=$VERSION" \
            "optionalDependencies.devsweep-linux-x64=$VERSION" \
            "optionalDependencies.@tarcisiopgs/devsweep-win32-arm64=$VERSION" \
            "optionalDependencies.@tarcisiopgs/devsweep-win32-x64=$VERSION"
          publish
