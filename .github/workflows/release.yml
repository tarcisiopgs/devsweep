name: Release

# Publishing a GitHub Release (e.g. `gh release create v0.2.0 --generate-notes`)
# builds the macOS and Linux binaries, attaches them to the release and publishes the npm
# packages through trusted publishing (OIDC). npm trusts this file by name.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # Static binaries: one file per architecture runs on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Attach the archive to the release
        run: |
          name="devsweep-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/devsweep" README.md LICENSE "$name/"
          mkdir "$name/assets"
          cp assets/devsweep-banner.webp "$name/assets/"
          tar -cJf "$name.tar.xz" "$name"
          shasum -a 256 "$name.tar.xz" > "$name.tar.xz.sha256"
          gh release upload "$TAG" "$name.tar.xz" "$name.tar.xz.sha256" --clobber

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or newer; no token is stored anywhere.
      - run: npm install -g npm@latest
      - name: Publish packages
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Re-running a release must not fail on versions already on npm.
          publish() {
            local name version
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
            else
              npm publish --provenance --access public
            fi
          }
          mkdir dl
          gh release download "$TAG" --pattern 'devsweep-*.tar.xz' --dir dl
          for entry in \
            "darwin:arm64:aarch64-apple-darwin" \
            "darwin:x64:x86_64-apple-darwin" \
            "linux:arm64:aarch64-unknown-linux-musl" \
            "linux:x64:x86_64-unknown-linux-musl"; do
            IFS=: read -r OS ARCH TARGET <<< "$entry"
            PKG="pkg-$OS-$ARCH"
            tar -xJf "dl/devsweep-$TARGET.tar.xz" -C dl
            mkdir -p "$PKG/bin"
            cp "dl/devsweep-$TARGET/devsweep" "$PKG/bin/devsweep"
            chmod +x "$PKG/bin/devsweep"
            OS="$OS" ARCH="$ARCH" VERSION="$VERSION" envsubst < npm/platform/package.json.tmpl > "$PKG/package.json"
            cp LICENSE "$PKG/"
            (cd "$PKG" && publish)
          done
          cd npm/devsweep
          cp ../../LICENSE ../../README.md .
          # npm renders the README outside the repository; resolve local links
          # against this release so its banner and reference links still work.
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.TAG;
          const repo = 'https://github.com/tarcisiopgs/devsweep';
          const readme = fs.readFileSync('README.md', 'utf8')
            .replace('(assets/devsweep-banner.webp)', `(https://raw.githubusercontent.com/tarcisiopgs/devsweep/${tag}/assets/devsweep-banner.webp)`)
            .replaceAll('(CONTRIBUTING.md)', `(${repo}/blob/${tag}/CONTRIBUTING.md)`)
            .replaceAll('(LICENSE)', `(${repo}/blob/${tag}/LICENSE)`);
          fs.writeFileSync('README.md', readme);
          NODE
          npm pkg set version="$VERSION" \
            "optionalDependencies.devsweep-darwin-arm64=$VERSION" \
            "optionalDependencies.devsweep-darwin-x64=$VERSION" \
            "optionalDependencies.devsweep-linux-arm64=$VERSION" \
            "optionalDependencies.devsweep-linux-x64=$VERSION"
          publish
