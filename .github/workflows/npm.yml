name: Publish to npm

# Runs after cargo-dist published a GitHub Release: repackages the macOS
# binaries as per-platform npm packages and publishes the `devsweep` shim.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build and publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for pair in "arm64:aarch64-apple-darwin" "x64:x86_64-apple-darwin"; do
            ARCH="${pair%%:*}"; TARGET="${pair#*:}"
            gh release download "$TAG" --pattern "devsweep-$TARGET.tar.xz" --dir dl
            mkdir -p "pkg-$ARCH/bin"
            tar -xJf "dl/devsweep-$TARGET.tar.xz" -C dl
            cp "dl/devsweep-$TARGET/devsweep" "pkg-$ARCH/bin/devsweep"
            chmod +x "pkg-$ARCH/bin/devsweep"
            ARCH="$ARCH" VERSION="$VERSION" envsubst < npm/platform/package.json.tmpl > "pkg-$ARCH/package.json"
            cp LICENSE "pkg-$ARCH/"
            (cd "pkg-$ARCH" && npm publish --provenance --access public)
          done
          cd npm/devsweep
          cp ../../LICENSE ../../README.md .
          npm pkg set version="$VERSION" \
            "optionalDependencies.@devsweep/darwin-arm64=$VERSION" \
            "optionalDependencies.@devsweep/darwin-x64=$VERSION"
          npm publish --provenance --access public
