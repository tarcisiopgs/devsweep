name: Publish to npm

# Called by cargo-dist's release workflow (publish-jobs in dist-workspace.toml):
# repackages the macOS binaries as per-platform npm packages and publishes the
# `devsweep` shim. A `release: published` trigger would never fire, because the
# release is created with GITHUB_TOKEN.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch release archives
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: dl
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5 or newer; no token is stored anywhere.
      - run: npm install -g npm@latest
      - name: Build and publish packages
        env:
          TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Re-running a release must not fail on versions already on npm.
          publish() {
            local name version
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
            else
              npm publish --provenance --access public
            fi
          }
          for pair in "arm64:aarch64-apple-darwin" "x64:x86_64-apple-darwin"; do
            ARCH="${pair%%:*}"; TARGET="${pair#*:}"
            mkdir -p "pkg-$ARCH/bin"
            tar -xJf "dl/devsweep-$TARGET.tar.xz" -C dl
            cp "dl/devsweep-$TARGET/devsweep" "pkg-$ARCH/bin/devsweep"
            chmod +x "pkg-$ARCH/bin/devsweep"
            ARCH="$ARCH" VERSION="$VERSION" envsubst < npm/platform/package.json.tmpl > "pkg-$ARCH/package.json"
            cp LICENSE "pkg-$ARCH/"
            (cd "pkg-$ARCH" && publish)
          done
          cd npm/devsweep
          cp ../../LICENSE ../../README.md .
          npm pkg set version="$VERSION" \
            "optionalDependencies.devsweep-darwin-arm64=$VERSION" \
            "optionalDependencies.devsweep-darwin-x64=$VERSION"
          publish
