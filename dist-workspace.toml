[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Publish the npm packages from the same run (see publish-npm.yml)
publish-jobs = ["./publish-npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# publish-npm.yml checks out the repo and publishes through OIDC; a called
# workflow cannot ask for more than its caller grants.
[dist.github-custom-job-permissions."publish-npm"]
contents = "read"
id-token = "write"
