[package]
name = "devsweep"
version = "0.2.5"
edition = "2024"
description = "Find and remove what a developer's Mac accumulates: build artifacts, agent worktrees, simulators, emulators, Docker leftovers and dev caches."
license = "MIT"
repository = "https://github.com/tarcisiopgs/devsweep"
homepage = "https://github.com/tarcisiopgs/devsweep"
keywords = ["cleanup", "disk", "macos", "tui", "developer-tools"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
ignore = "0.4.33"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
