[package]
name = "devsweep"
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
description = "Find and remove what a developer's machine accumulates: build artifacts, agent worktrees, simulators, emulators, Docker leftovers and dev caches."
license = "MIT"
repository = "https://github.com/tarcisiopgs/devsweep"
homepage = "https://github.com/tarcisiopgs/devsweep"
keywords = ["cleanup", "disk", "macos", "linux", "windows"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
ignore = "0.4.33"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Tests may unwrap (see clippy.toml); production code handles the error.
unwrap_used = "warn"
expect_used = "warn"
map_unwrap_or = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[target."cfg(windows)".dependencies]
dunce = "1.0"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
